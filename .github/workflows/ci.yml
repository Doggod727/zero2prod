name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ~/.cargo
  CARGO_TARGET_DIR: target
  # 用仓库里提交的 sqlx-data.json 做查询校验，而不是连数据库。
  # 好处：CI 里的编译不需要数据库可达、不需要 DATABASE_URL 的权限，
  # 而且能保证「提交的离线数据」和「代码里的查询」是一致的 ——
  # 一旦有人改了 SQL 却忘了 cargo sqlx prepare，这一步就会挂。
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/newsletter
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install sqlx-cli
        # ⚠️ 必须锁版本，而且要和 Cargo.toml 里的 sqlx 一致（0.6.3）。
        #    不锁的话装的是最新的 0.8.x，而它的迁移目录格式、迁移表语义
        #    都和 0.6 不同 —— 表现是「本地好好的，CI 上迁移报错」。
        run: cargo install sqlx-cli --version 0.6.3 --locked --no-default-features --features postgres,native-tls

      - name: Migrate database
        run: sqlx migrate run

      # 验证提交的 sqlx-data.json 是最新的。
      #
      # ⚠️ 两处不能改：
      #
      # 1. `-- --all-targets` 而不是 `-- --lib`。
      #    只给 lib 生成缓存的话，tests/api/ 里那 20 条测试专有查询
      #    （比如 SELECT count(*) FROM subscriptions WHERE email = $1）
      #    不会被写进 sqlx-data.json，于是下面开着 SQLX_OFFLINE 跑 cargo test
      #    会直接编译失败：
      #        error: failed to find data for query SELECT count(*) ...
      #    当前缓存 46 条 = lib 26 条 + integration test 20 条。
      #    这也正是「提交缓存」的意义：它同时锁住了生产代码和测试代码的 SQL。
      #
      # 2. 必须【关掉】SQLX_OFFLINE：--check 要真的连库重新生成一遍再和提交的版本比对，
      #    离线模式下它无从生成，这一步就变成空跑（看着绿，其实什么也没验证）。
      - name: Verify sqlx offline data
        env:
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check -- --all-targets

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy static analysis
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage report
        run: cargo tarpaulin --verbose --out xml --out html

      # ---------------------------------------------------------------
      # 依赖安全审计
      # ---------------------------------------------------------------
      # 这里【不】用 -D / --deny 让它阻塞构建，原因写清楚，免得看起来像在掩盖问题：
      #
      # 1. 漏洞全部来自 sqlx 0.6 / actix-session 0.6 那条老依赖树，都是传递依赖：
      #      h2 0.3.27           (hyper ← reqwest/actix)
      #      rustls 0.20 / webpki / ring 0.16.20 / rustls-pemfile 1.0.4
      #      idna 0.2 / 0.3
      #      sqlx 0.6.3
      #    其中 sqlx 那条（RUSTSEC-2024-0363「协议层查询走私」）我们评估过：
      #    触发条件是「协议层编码一个 >4GiB 的值」，本项目没有任何一条
      #    用户可控的输入能接近这个量级，判为不可达（详见 README 的安全一节）。
      #
      # 2. 修它们等于把 sqlx 0.6→0.7+ 和整个 rustls 栈换掉，
      #    不是「顺手升级」，是一次独立的重构 —— 应该单开一条任务做，
      #    而不是让它卡住每一次 CI。
      #
      # 所以这一步的定位是【可见性】：让每次 CI 都把当前漏洞清单打印出来，
      # 而不是静默通过。真要做到「有例外也能阻塞」，正确工具是 cargo-deny +
      # deny.toml：把每条 advisory 写成带 reason 和 expires 的例外，
      # 这样新增漏洞依然会挂 CI，而已知例外有记录、有过期时间。
      # 那是下一步计划，不是现在。
      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Security audit dependencies (informational)
        continue-on-error: true
        run: cargo audit